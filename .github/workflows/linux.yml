name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collaboration:
    name: Workspace, collaboration and integrations on Ubuntu 24.04
    runs-on: ubuntu-24.04
    container: swift:6.4.3-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Linux dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git pkg-config libargon2-dev libsqlite3-dev libcurl4-openssl-dev zlib1g-dev python3 openssl
          swift --version
      - name: Build and check the SPA
        working-directory: Web
        run: |
          npm ci
          npm run check
          npm run build
      - name: Build and test the Linux server
        run: |
          swift build --force-resolved-versions
          swift test --force-resolved-versions
          python3 -m unittest discover -s Tests -p '*.py'
      - name: Test the release executable in Chromium
        working-directory: Web
        run: |
          swift build --package-path .. -c release --force-resolved-versions
          npx --no-install playwright-core install --with-deps chromium
          export TEFTER_TEST_CHROME="$(node --input-type=module -e 'import {chromium} from "playwright-core"; console.log(chromium.executablePath())')"
          TEFTER_TEST_BINARY=.build/release/tefter npm run test:browser
          TEFTER_TEST_BINARY=.build/release/tefter node tests/stage3.mjs
